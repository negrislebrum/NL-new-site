# Negris LeBrum site — tells Netlify where the site and the concierge brain live.
[build]
  publish = "."
  functions = "netlify/functions"
  # Regenerates SEO titles, Product schema, sitemap.xml and robots.txt from index.html (scripts/seo.mjs).
  command = "node scripts/seo.mjs"

# Apple Pay domain verification — served as-is from /.well-known (publish dir is the repo root).
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "text/plain"

# NL Live — /live is a page of the single-page site.
[[redirects]]
  from = "/live"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/live/"
  to = "/index.html"
  status = 200

# Every page and product has its own address; all are served by the single-page site,
# which opens the right page (and the seo edge function sets its title, description and share image).

